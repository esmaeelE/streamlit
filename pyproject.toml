[project]
name = "streamlit-app"
version = "0.1.0"
description = "Dockerize streamlit with uv."
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.45.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_app"]
